<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" fill="none">
  <defs>
    <linearGradient id="busBody" x1="0" y1="30" x2="360" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0A315D"/>
    </linearGradient>
    <linearGradient id="busAccent" x1="0" y1="0" x2="360" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F55400"/>
      <stop offset="100%" stop-color="#FF7A29"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="45" x2="0" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>

  <!-- Sombra inferior -->
  <ellipse cx="180" cy="172" rx="148" ry="10" fill="#0F172A" fill-opacity="0.18"/>

  <!-- Cuerpo principal del bus -->
  <rect x="32" y="34" width="296" height="118" rx="18" fill="url(#busBody)" stroke="#0F172A" stroke-width="3"/>

  <!-- Franja naranja corporativa -->
  <path d="M32 110 H328 V126 H32 Z" fill="url(#busAccent)"/>

  <!-- Techo / Aire acondicionado -->
  <rect x="96" y="24" width="76" height="10" rx="5" fill="#475569"/>
  <rect x="200" y="26" width="54" height="8" rx="4" fill="#64748B"/>

  <!-- Ventanas de pasajeros -->
  <rect x="48" y="48" width="46" height="50" rx="6" fill="url(#glass)" stroke="#0F172A" stroke-width="2"/>
  <rect x="102" y="48" width="48" height="50" rx="6" fill="url(#glass)" stroke="#0F172A" stroke-width="2"/>
  <rect x="158" y="48" width="48" height="50" rx="6" fill="url(#glass)" stroke="#0F172A" stroke-width="2"/>
  <rect x="214" y="48" width="44" height="50" rx="6" fill="url(#glass)" stroke="#0F172A" stroke-width="2"/>

  <!-- Puerta y parabrisas frontal derecho -->
  <rect x="266" y="48" width="26" height="92" rx="5" fill="#E0F2FE" stroke="#0F172A" stroke-width="2"/>
  <line x1="279" y1="48" x2="279" y2="140" stroke="#0F172A" stroke-width="2"/>
  <path d="M298 48 H318 C323 48 327 52 327 58 V98 H298 Z" fill="url(#glass)" stroke="#0F172A" stroke-width="2"/>

  <!-- Reflejos en ventanas -->
  <path d="M54 54 L66 54 L56 90 L48 90 Z" fill="#FFFFFF" fill-opacity="0.45"/>
  <path d="M108 54 L120 54 L110 90 L102 90 Z" fill="#FFFFFF" fill-opacity="0.45"/>
  <path d="M164 54 L176 54 L166 90 L158 90 Z" fill="#FFFFFF" fill-opacity="0.45"/>

  <!-- Letrero de ruta superior -->
  <rect x="270" y="37" width="46" height="7" rx="3.5" fill="#FACC15"/>

  <!-- Luces delanteras y traseras -->
  <rect x="319" y="128" width="9" height="14" rx="3" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5"/>
  <rect x="32" y="126" width="7" height="16" rx="3" fill="#EF4444"/>

  <!-- Parachoques -->
  <rect x="26" y="142" width="308" height="10" rx="5" fill="#1E293B"/>

  <!-- Rueda trasera -->
  <circle cx="98" cy="152" r="22" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
  <circle cx="98" cy="152" r="11" fill="#CBD5E1"/>
  <circle cx="98" cy="152" r="4" fill="#475569"/>

  <!-- Rueda delantera -->
  <circle cx="248" cy="152" r="22" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
  <circle cx="248" cy="152" r="11" fill="#CBD5E1"/>
  <circle cx="248" cy="152" r="4" fill="#475569"/>
</svg>
