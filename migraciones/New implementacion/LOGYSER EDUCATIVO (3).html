function colab(id){return R.org.colabs.find(c=>c.id==id)}

function cargo(id){return R.org.cargos.find(c=>c.id==id)}
function areaOf(col){var c=cargo(col.cargo);return c?c.a:null}
function nmOf(l,id){var x=R.org[l].find(y=>y.id==id);return x?x.n:""}
function uidOf(cid){return Object.keys(R.vinc).find(u=>R.vinc[u].c==cid)}
function match(c,col){var a=c.aud||{};return !!(a.all||(a.areas||[]).includes(areaOf(col))||(a.cargos||[]).includes(col.cargo)||(a.pers||[]).includes(col.id)||(a.part&&partMatch(a.part,col))||(c.id&&routeHas(c.id,col)))}
function visibles(col){return Object.values(R.cursos).filter(c=>c.estado=="publicado"&&match(c,col))}
function pg(uid,cid){var d=R.prog[uid];return(d&&d.c&&d.c[cid])||{done:[],tries:0,ok:false}}
function pct(c,p){var t=c.mods.length+(c.qs.length?1:0);return t?Math.round((p.done.length+(p.ok&&c.qs.length?1:0))*100/t):0}
function stt(c,p){return fin_(c,p)?"completada":(p.done.length||p.tries)?"en_progreso":"pendiente"}
async function savePg(cid,p){var d=R.prog[UID]||{c:{},seen:[]};d.c=d.c||{};p.ts=Date.now();d.c[cid]=p;R.prog[UID]=d;try{await DB.doc("prog/"+UID).set(d)}catch(e){err(e)}}

function padInit(){document.querySelectorAll("canvas.pad").forEach(cv=>{var k=cv.dataset.k,ctx=cv.getContext("2d");cv.width=Math.max(200,cv.clientWidth||300);cv.height=100;ctx.lineWidth=2;ctx.lineCap="round";ctx.strokeStyle="#102B50";
  if(I.firmas[k]){var im=new Image();im.onload=()=>ctx.drawImage(im,0,0,cv.width,cv.height);im.src=I.firmas[k]}
