# Despliegue de PRUEBA (vista previa) para ramas que no son main.
#
# Qué hace:
#   1. Construye la imagen Docker de la rama.
#   2. Copia las variables de entorno del servicio de producción (digital-logyser, us-east1)
#      directamente desde Cloud Run, sin guardarlas en el repositorio.
#   3. Despliega en un servicio APARTE: digital-logyser-prueba.
#      Producción (digital-logyser) no se toca en ningún momento.
#   4. Activa DISABLE_BACKGROUND_JOBS=true para que la versión de prueba NO envíe
#      correos automáticos ni procese tareas programadas (comparte la base de datos
#      de producción).
#
# Se usa con un activador de Cloud Build que escucha las ramas claude/*.

substitutions:
  _REGION: us-east1
  _SERVICIO_PROD: digital-logyser
  _SERVICIO_PRUEBA: digital-logyser-prueba
  _IMAGEN: europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/doclogyser-firmas/digital-logyser-prueba

steps:
  - id: construir
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGEN}:${SHORT_SHA}', '.']

  - id: subir-imagen
    name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGEN}:${SHORT_SHA}']

  - id: copiar-configuracion
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run services describe ${_SERVICIO_PROD} --region=${_REGION} --format=json > prod.json
        python3 - <<'PY'
        import json
        s = json.load(open('prod.json'))
        spec = s['spec']['template']['spec']
        c = spec['containers'][0]
        lineas = []
        for e in c.get('env', []):
            if e['name'] == 'DISABLE_BACKGROUND_JOBS':
                continue
            if 'value' not in e:
                print('AVISO: la variable %s viene de Secret Manager y no se copia.' % e['name'])
                continue
            lineas.append('%s: %s' % (e['name'], json.dumps(e['value'])))
        lineas.append('DISABLE_BACKGROUND_JOBS: "true"')
        open('env-prueba.yaml', 'w').write('\n'.join(lineas) + '\n')
        open('cuenta-servicio.txt', 'w').write(spec.get('serviceAccountName', ''))
        lim = c.get('resources', {}).get('limits', {})
        open('memoria.txt', 'w').write(lim.get('memory', '1Gi'))
        open('cpu.txt', 'w').write(str(lim.get('cpu', '1')))
        open('timeout.txt', 'w').write(str(spec.get('timeoutSeconds', 300)))
        # Conexión a la base de datos y red: Cloud SQL (socket /cloudsql) y conector VPC.
        ann = s['spec']['template'].get('metadata', {}).get('annotations', {})
        extra = []
        if ann.get('run.googleapis.com/cloudsql-instances'):
            extra.append('--set-cloudsql-instances=' + ann['run.googleapis.com/cloudsql-instances'])
        if ann.get('run.googleapis.com/vpc-access-connector'):
            extra.append('--vpc-connector=' + ann['run.googleapis.com/vpc-access-connector'])
        if ann.get('run.googleapis.com/vpc-access-egress'):
            extra.append('--vpc-egress=' + ann['run.googleapis.com/vpc-access-egress'])
        if ann.get('run.googleapis.com/network-interfaces'):
            ni = json.loads(ann['run.googleapis.com/network-interfaces'])[0]
            if ni.get('network'): extra.append('--network=' + ni['network'])
            if ni.get('subnetwork'): extra.append('--subnet=' + ni['subnetwork'])
        open('red.txt', 'w').write(' '.join(extra))
        print('Conexiones copiadas de producción:', extra or 'ninguna')
        PY

  - id: desplegar-prueba
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        CUENTA=$$(cat cuenta-servicio.txt)
        RAMA="${BRANCH_NAME}"
        MEMORIA=$$(cat memoria.txt); CPU=$$(cat cpu.txt); TIEMPO=$$(cat timeout.txt); RED=$$(cat red.txt)
        gcloud run deploy ${_SERVICIO_PRUEBA} \
          --image=${_IMAGEN}:${SHORT_SHA} \
          --region=${_REGION} \
          --env-vars-file=env-prueba.yaml \
          $${CUENTA:+--service-account=$$CUENTA} \
          --port=8080 \
          --memory=$$MEMORIA \
          --cpu=$$CPU \
          --timeout=$$TIEMPO \
          --min-instances=0 \
          --max-instances=2 \
          --allow-unauthenticated \
          $$RED \
          --labels=entorno=prueba,rama=$${RAMA//\//-}
        echo "URL de prueba:"
        gcloud run services describe ${_SERVICIO_PRUEBA} --region=${_REGION} --format='value(status.url)'

images:
  - '${_IMAGEN}:${SHORT_SHA}'

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
