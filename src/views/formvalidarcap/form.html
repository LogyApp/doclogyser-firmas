<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validar Carpeta — LOG&SER</title>
  <link rel="icon" type="image/png" href="https://storage.googleapis.com/logyser-recursos-corporativos/menu-solicitudes/Logodocnomina.png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #000b59;
      --primary-dark: #00073a;
      --accent: #F55400;
      --accent-soft: rgba(245, 84, 0, 0.1);
      --success: #16a34a;
      --success-soft: rgba(22, 163, 74, 0.08);
      --danger: #dc2626;
      --bg: #f4f5f9;
      --card-bg: #ffffff;
      --text: #101425;
      --text-muted: #6b7280;
      --border: #e7e8ef;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.04);
      --shadow-md: 0 8px 20px -6px rgba(16, 24, 40, 0.10), 0 2px 6px -2px rgba(16, 24, 40, 0.06);
      --shadow-lg: 0 20px 40px -12px rgba(0, 11, 89, 0.22);
      --transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.5; padding: 24px; }
    
    .container { max-width: 700px; margin: 0 auto; }

    /* Header styling matching logysign */
    header {
      background: var(--primary);
      border-radius: var(--radius-lg);
      padding: 14px 24px;
      color: #fff;
      margin-bottom: 22px;
      box-shadow: var(--shadow-lg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }

    header::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 3px;
      background: var(--accent);
    }

    .brand-lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      flex-shrink: 0;
    }

    .brand-lockup img.brand-logo-app {
      display: block;
      object-fit: contain;
      height: 30px;
    }

    .brand-logo-company-crop {
      width: 133px;
      height: 34px;
      overflow: hidden;
      position: relative;
    }

    .brand-logo-company-crop img {
      position: absolute;
      left: -64px;
      top: -65px;
      width: 268px;
      height: 178px;
      max-width: none;
    }

    .brand-divider {
      width: 80%;
      height: 1.5px;
      background: rgba(255, 255, 255, 0.22);
    }

    .header-logo {
      text-align: right;
    }

    .header-logo h1 {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.8rem;
      letter-spacing: -0.03em;
      margin: 0;
      line-height: 1.1;
    }

    .header-logo h1 span.accent {
      color: var(--accent);
    }

    .header-logo p {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 4px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Card styling */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 30px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Forms */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 20px;
      position: relative;
    }

    label {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--primary);
      letter-spacing: 0.02em;
    }

    input[type="text"] {
      padding: 11px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      color: var(--text);
      background-color: #fff;
      transition: var(--transition);
      outline: none;
      width: 100%;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(0, 11, 89, 0.05);
    }

    /* Autocomplete Suggestions list */
    .suggestions-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 100%;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
      z-index: 100;
      max-height: 240px;
      overflow-y: auto;
    }

    .suggestion-item {
      padding: 10px 16px;
      font-size: 0.9rem;
      color: var(--text);
      cursor: pointer;
      transition: var(--transition);
      border-bottom: 1px solid var(--border);
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background-color: #f1f5f9;
      color: var(--primary);
      font-weight: 500;
    }

    /* Info Block */
    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 24px;
      animation: slideIn 0.2s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .details-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .details-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .details-val {
      font-weight: 600;
      color: var(--primary);
      font-size: 0.92rem;
    }

    /* Custom buttons group */
    .opt-container {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .opt-btn {
      flex: 1;
      padding: 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      text-align: center;
      transition: var(--transition);
    }

    .opt-btn:hover {
      background-color: #f8fafc;
      border-color: var(--text-muted);
    }

    .opt-btn.selected[data-value="OK"] {
      border-color: var(--success);
      background-color: var(--success-soft);
      color: var(--success);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
    }

    .opt-btn.selected[data-value="PEND"] {
      border-color: var(--danger);
      background-color: rgba(220, 38, 38, 0.05);
      color: var(--danger);
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
    }

    /* Buttons */
    .btn {
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      outline: none;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(245, 84, 0, 0.25);
      width: 100%;
    }

    .btn-primary:hover {
      background-color: var(--accent-dark);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background-color: #fff;
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      text-decoration: none;
      margin-top: 10px;
      width: 100%;
    }

    .btn-secondary:hover {
      background-color: #f8fafc;
      color: var(--text);
    }

    /* Modal success overlay */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(16, 20, 37, 0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 35px;
      max-width: 450px;
      width: 90%;
      text-align: center;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      animation: modalScale 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes modalScale {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: var(--success-soft);
      color: var(--success);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .modal-h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .modal-p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 24px;
      line-height: 1.45;
    }

    /* Toast alert */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--danger);
      color: #fff;
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
      display: none;
      align-items: center;
      z-index: 2000;
      font-size: 0.9rem;
      font-weight: 500;
    }

    /* Loader */
    .loader {
      display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Toast -->
  <div class="toast" id="toast">
    <span id="toast-message">Mensaje de error</span>
  </div>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand-lockup">
        <img class="brand-logo-app" src="https://storage.googleapis.com/logyser-recursos-corporativos/Imagenes/Logo%20LogyApp.png" alt="LogyApp">
        <div class="brand-divider"></div>
        <div class="brand-logo-company-crop">
          <img src="https://storage.googleapis.com/logyser-recursos-corporativos/Imagenes/Logyser%20sin%20Nit.png" alt="Logyser">
        </div>
      </div>
      <div class="header-logo">
        <h1>Cloud<span class="accent">Docs</span></h1>
        <p>Validación de Carpeta</p>
      </div>
    </header>

    <div class="card">
      <h2 class="card-title">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent);"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        Validar Carpeta de Trabajador
      </h2>

      <form id="validar-form" onsubmit="onSubmitForm(event)">
        <!-- Autocomplete Trabajador -->
        <div class="field">
          <label for="buscar-trabajador">Buscar Trabajador (Nombre o Cédula)*</label>
          <input type="text" id="buscar-trabajador" placeholder="Escribe para buscar..." autocomplete="off" oninput="onAutocompleteInput()">
          <div id="autocomplete-suggestions" class="suggestions-list" style="display: none;"></div>
        </div>

        <!-- Details Card -->
        <div id="worker-details-block" class="details-grid" style="display: none;">
          <div class="details-item">
            <span class="details-label">Cargo</span>
            <span class="details-val" id="disp-cargo">—</span>
          </div>
          <div class="details-item">
            <span class="details-label">Regional</span>
            <span class="details-val" id="disp-regional">—</span>
          </div>
          <div class="details-item">
            <span class="details-label">Operación</span>
            <span class="details-val" id="disp-operacion">—</span>
          </div>
          <div class="details-item">
            <span class="details-label">Estado</span>
            <span class="details-val" id="disp-estado">—</span>
          </div>
          <div class="details-item" style="grid-column: span 2;">
            <span class="details-label">Fecha de Ingreso</span>
            <span class="details-val" id="disp-ingreso">—</span>
          </div>
        </div>

        <!-- Estado Selector -->
        <div class="field">
          <label>Estado de la Carpeta*</label>
          <div class="opt-container">
            <button type="button" class="opt-btn" data-value="OK" onclick="selectEstado('OK')">OK</button>
            <button type="button" class="opt-btn" data-value="PEND" onclick="selectEstado('PEND')">PEND</button>
          </div>
        </div>

        <!-- Submit Buttons -->
        <div style="margin-top: 30px;">
          <button type="submit" class="btn btn-primary" id="btn-enviar">
            Guardar Validación
          </button>
          <a href="#" class="btn btn-secondary" id="btn-cancelar">
            Cancelar
          </a>
        </div>
      </form>
    </div>
  </div>

  <!-- Success Modal -->
  <div class="modal-overlay" id="success-modal">
    <div class="modal-content">
      <div class="modal-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <h3 class="modal-h3">Validación Guardada</h3>
      <p class="modal-p" id="modal-success-desc">
        La carpeta del trabajador se ha validado correctamente.
      </p>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button class="btn btn-primary" style="background-color: var(--primary);" onclick="volverListado()">
          Volver a Cloud Docs
        </button>
        <button class="btn btn-secondary" style="margin-top: 0;" onclick="reiniciarFormulario()">
          Validar Otro Trabajador
        </button>
      </div>
    </div>
  </div>

  <script>
    // Extract query parameters
    const urlParams = new URLSearchParams(window.location.search);
    const CONFIG = {
      usuarioId: urlParams.get('usuario') || ''
    };

    let selectedWorker = null;
    let selectedEstado = null;
    let autocompleteTimeout = null;

    document.addEventListener('DOMContentLoaded', () => {
      if (!CONFIG.usuarioId) {
        showToast('Error: Parámetro de usuario requerido', 'error');
        document.getElementById('btn-enviar').disabled = true;
      }
      
      // Update back links
      const backUrl = `/cloud-docs?usuario=${encodeURIComponent(CONFIG.usuarioId)}`;
      document.getElementById('btn-cancelar').href = backUrl;
    });

    // Handle typing in autocomplete field
    function onAutocompleteInput() {
      clearTimeout(autocompleteTimeout);
      const input = document.getElementById('buscar-trabajador');
      const term = input.value.trim();
      const list = document.getElementById('autocomplete-suggestions');

      if (term.length < 2) {
        list.style.display = 'none';
        list.innerHTML = '';
        return;
      }

      autocompleteTimeout = setTimeout(async () => {
        try {
          const res = await fetch(`/formvalidarcap/api/buscar-trabajadores?q=${encodeURIComponent(term)}&usuario=${encodeURIComponent(CONFIG.usuarioId)}`);
          const rows = await res.json();
          
          if (res.ok && Array.isArray(rows) && rows.length > 0) {
            list.innerHTML = rows.map(r => `
              <div class="suggestion-item" onclick="onSelectWorker(${JSON.stringify(r).replace(/"/g, '&quot;')})">
                ${esc(r.trabajador)} (${r.identificacion})
              </div>
            `).join('');
            list.style.display = 'block';
          } else {
            list.innerHTML = '<div class="suggestion-item" style="color:#94a3b8; cursor:default;">No se encontraron resultados</div>';
            list.style.display = 'block';
          }
        } catch (err) {
          console.error(err);
        }
      }, 300);
    }

    // Select worker from auto-complete suggestions
    function onSelectWorker(worker) {
      selectedWorker = worker;
      document.getElementById('buscar-trabajador').value = `${worker.trabajador} (${worker.identificacion})`;
      document.getElementById('autocomplete-suggestions').style.display = 'none';

      // Fill details block
      document.getElementById('disp-cargo').textContent = worker.cargo || 'N/A';
      document.getElementById('disp-regional').textContent = worker.Regional || 'N/A';
      document.getElementById('disp-operacion').textContent = worker.operacion || 'N/A';
      document.getElementById('disp-estado').textContent = worker.Estado || 'N/A';
      document.getElementById('disp-ingreso').textContent = worker.fechaIngreso || 'N/A';

      document.getElementById('worker-details-block').style.display = 'grid';
    }

    // Select Estado buttons
    function selectEstado(val) {
      selectedEstado = val;
      document.querySelectorAll('.opt-btn').forEach(btn => {
        btn.classList.remove('selected');
        if (btn.getAttribute('data-value') === val) {
          btn.classList.add('selected');
        }
      });
    }

    // Submit form
    async function onSubmitForm(e) {
      e.preventDefault();
      if (!selectedWorker) {
        showToast('Debes buscar y seleccionar un trabajador de la lista.', 'error');
        return;
      }
      if (!selectedEstado) {
        showToast('Debes seleccionar el estado (OK o PEND).', 'error');
        return;
      }

      const btnSubmit = document.getElementById('btn-enviar');
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<div class="loader"></div> Guardando...';

      try {
        const res = await fetch('/formvalidarcap/api/validar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            identificacion: selectedWorker.identificacion,
            estado: selectedEstado,
            usuario: CONFIG.usuarioId
          })
        });

        const data = await res.json();
        if (res.ok && data.ok) {
          document.getElementById('modal-success-desc').innerHTML = `
            La carpeta de <strong>${esc(selectedWorker.trabajador)}</strong> se ha validado en estado <strong>${selectedEstado}</strong>.<br>
            Código de cargue: <strong>${data.idCargue}</strong>.<br>
            Registros de documentos actualizados: <strong>${data.affectedRows}</strong>.
          `;
          document.getElementById('success-modal').style.display = 'flex';
        } else {
          showToast(data.error || 'Error al guardar validación', 'error');
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Guardar Validación';
        }
      } catch (err) {
        console.error(err);
        showToast('Error de conexión con el servidor', 'error');
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Guardar Validación';
      }
    }

    // Navigation and reset actions
    function volverListado() {
      window.location.href = `/cloud-docs?usuario=${encodeURIComponent(CONFIG.usuarioId)}`;
    }

    function reiniciarFormulario() {
      selectedWorker = null;
      selectedEstado = null;
      document.getElementById('buscar-trabajador').value = '';
      document.getElementById('worker-details-block').style.display = 'none';
      document.querySelectorAll('.opt-btn').forEach(btn => btn.classList.remove('selected'));
      document.getElementById('success-modal').style.display = 'none';
      
      const btnSubmit = document.getElementById('btn-enviar');
      btnSubmit.disabled = false;
      btnSubmit.textContent = 'Guardar Validación';
    }

    // Toast alert helper
    function showToast(msg, type = 'error') {
      const toast = document.getElementById('toast');
      const msgSpan = document.getElementById('toast-message');
      msgSpan.textContent = msg;
      toast.style.background = type === 'error' ? 'var(--danger)' : 'var(--success)';
      toast.style.display = 'flex';
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    // Escape HTML to prevent XSS
    function esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
