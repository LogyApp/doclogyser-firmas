<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Participación — LOG&SER</title>
  <link rel="icon" type="image/png" href="https://storage.googleapis.com/logyser-recibos-public/logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f6f9; min-height: 100vh; color: #333; }
    .wrapper { max-width: 800px; margin: 0 auto; padding: 20px 16px 60px; }

    /* ── Header Card ── */
    .card-titulo {
      background: #fff; border-radius: 8px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      padding: 20px 24px; margin-bottom: 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
    }
    .card-titulo img { height: 55px; flex-shrink: 0; }
    .page-title { font-size: 1.3rem; font-weight: bold; color: #1a1a2e; }
    .page-sub   { font-size: .85rem; color: #777; margin-top: 2px; }
    .badge-user {
      display: inline-flex; align-items: center; gap: 5px;
      border-radius: 20px; padding: 4px 12px;
      font-size: .75rem; font-weight: 600;
      background: #eef1ff; border: 1px solid #c5d0f5; color: #1a1a6e;
      margin-top: 8px;
    }

    /* ── Cards ── */
    .card {
      background: #fff; border-radius: 8px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
      border-left: 4px solid #8e44ad;
      padding: 20px 22px; margin-bottom: 16px;
    }
    .card-purple  { border-left-color: #8e44ad; }
    .card-blue    { border-left-color: #2980b9; }

    .section-title {
      font-size: .8rem; font-weight: bold; color: #1a1a2e;
      letter-spacing: 1.3px; text-transform: uppercase;
      padding-bottom: 8px; margin-bottom: 16px;
      border-bottom: 2px solid #eef1ff;
    }

    /* ── Forms ── */
    .field { margin-bottom: 16px; position: relative; }
    .field:last-child { margin-bottom: 0; }
    label.lbl { display: block; font-size: .82rem; font-weight: 600; color: #444; margin-bottom: 6px; }
    label.lbl .req { color: #c0392b; margin-left: 2px; }
    input[type="text"], input[type="time"], input[type="date"],
    select, textarea {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid #ddd; border-radius: 6px;
      font-size: .93rem; color: #333; background: #fff;
      font-family: Arial, sans-serif;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: #8e44ad; box-shadow: 0 0 0 3px rgba(142,68,173,.12);
    }
    textarea { resize: vertical; min-height: 80px; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

    /* ── Autocomplete ── */
    .ac-list {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: #fff; border: 1.5px solid #8e44ad;
      border-radius: 6px; max-height: 220px; overflow-y: auto;
      z-index: 999; display: none;
      box-shadow: 0 6px 20px rgba(142,68,173,.15);
    }
    .ac-list.open { display: block; }
    .ac-item {
      padding: 10px 14px; cursor: pointer; font-size: .88rem; color: #333;
      border-bottom: 1px solid #f5f5f5;
    }
    .ac-item:hover { background: #eef1ff; color: #1a1a2e; font-weight: 600; }

    /* ── Scrollable Checklist for Attendees ── */
    .checklist-card {
      border: 1.5px solid #ddd;
      border-radius: 6px;
      background: #fff;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 10px;
    }
    .checklist-header {
      padding: 10px 12px;
      background: #f8fafc;
      border-bottom: 1.5px solid #ddd;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .checklist-search {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: .85rem;
    }
    .checklist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
    }
    .checklist-item:last-child {
      border-bottom: none;
    }
    .checklist-item:hover {
      background: #f8fafc;
    }
    .checklist-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #8e44ad;
      cursor: pointer;
    }
    .checklist-item label {
      font-size: .88rem;
      color: #1e293b;
      cursor: pointer;
      flex: 1;
    }

    /* ── Buttons ── */
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 18px; border: none; border-radius: 6px;
      font-size: .85rem; font-weight: 600; cursor: pointer;
      text-decoration: none; transition: all .15s;
    }
    .btn-primary { background: #8e44ad; color: #fff; }
    .btn-primary:hover { background: #763693; box-shadow: 0 3px 10px rgba(142,68,173,.3); }

    .btn-secondary { background: #f5f6fa; border: 1.5px solid #ddd; color: #444; }
    .btn-secondary:hover { background: #eef1ff; border-color: #8e44ad; }
    .btn-success { background: #27ae60; color: #fff; }
    .btn-success:hover { background: #1e8449; }

    /* ── Toast ── */
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { padding: 12px 18px; border-radius: 6px; color: #fff; font-size: .88rem; box-shadow: 0 4px 12px rgba(0,0,0,.15); animation: slideIn .3s ease; }
    .toast.success { background: #27ae60; }
    .toast.error { background: #c0392b; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ── Loading Spinner ── */
    .loading-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,.8); display: flex; align-items: center; justify-content: center;
      z-index: 9999; opacity: 0; pointer-events: none; transition: opacity .2s;
      flex-direction: column; gap: 12px;
    }
    .loading-overlay.active { opacity: 1; pointer-events: auto; }
    .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #8e44ad; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .card-titulo { flex-direction: column; text-align: center; }
      .card-titulo img { height: 42px; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div id="toast-container"></div>
  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
    <div style="font-weight: bold; color: #475569;" id="loading-text">Cargando...</div>
  </div>

  <div class="card-titulo">
    <img src="https://storage.googleapis.com/logyser-recibo-public/Logyser%20sin%20Nit.png" alt="Logo LOG&SER">
    <div>
      <div class="page-title" id="form-titulo">Crear Formato de Asistencia</div>
      <div class="page-sub">Diligencia los campos requeridos y adiciona a los asistentes</div>
      <div id="user-badge" class="badge-user">Cargando usuario...</div>
    </div>
  </div>

  <form id="form-asistencia">
    <div class="card card-purple">
      <div class="section-title">Información Básica</div>
      <div class="field">
        <label class="lbl">Tema de la Jornada <span class="req">*</span></label>
        <input type="text" id="form-tema" required placeholder="Ej. Capacitación sobre riesgos laborales">
      </div>

      <div class="grid-3">
        <div class="field">
          <label class="lbl">Fecha <span class="req">*</span></label>
          <input type="date" id="form-fecha" required>
        </div>
        <div class="field">
          <label class="lbl">Hora Inicial <span class="req">*</span></label>
          <input type="time" id="form-hora-inicial" required>
        </div>
        <div class="field">
          <label class="lbl">Hora Final <span class="req">*</span></label>
          <input type="time" id="form-hora-final" required>
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label class="lbl">Lugar de Capacitación <span class="req">*</span></label>
          <input type="text" id="form-lugar" required placeholder="Ej. Oficina Principal - Sala A">
        </div>
        <div class="field" style="position: relative;">
          <label class="lbl">Responsable del Registro (Cédula) <span class="req">*</span></label>
          <input type="text" id="form-responsable-input" placeholder="Buscar únicamente por Identificación..." autocomplete="off">
          <input type="hidden" id="form-responsable-id">
          <div id="ac-responsable" class="ac-list"></div>
        </div>
      </div>

      <div class="field">
        <label class="lbl">Objetivo / Propósito</label>
        <textarea id="form-objetivo" placeholder="Describe brevemente el objetivo..."></textarea>
      </div>
    </div>

    <div class="card card-blue">
      <div class="section-title">Adicionar Asistentes (Por Regional y Operación)</div>
      
      <div class="grid-2">
        <div class="field">
          <label class="lbl">Regional de los Asistentes</label>
          <select id="form-asistente-regional">
            <option value="">Seleccione Regional...</option>
          </select>
        </div>
        <div class="field">
          <label class="lbl">Operación de los Asistentes</label>
          <select id="form-asistente-operacion">
            <option value="">Seleccione Operación...</option>
          </select>
        </div>
      </div>

      <!-- Scrollable checklist list -->
      <div style="margin-top: 15px; display: none;" id="form-asistentes-checklist-wrap">
        <label class="lbl">Selección de Trabajadores Activos</label>
        <div class="checklist-card">
          <div class="checklist-header">
            <input type="text" class="checklist-search" id="checklist-search-input" placeholder="Buscar asistente por Nombre o Cédula...">
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px; padding-left: 2px;">
              <input type="checkbox" id="chk-seleccionar-todos" style="width: 16px; height: 16px; cursor: pointer;">
              <label for="chk-seleccionar-todos" style="font-size: .82rem; font-weight: bold; cursor: pointer;">Seleccionar Todos</label>
            </div>
          </div>
          <div id="form-checklist-body">
            <!-- Cargado dinámicamente -->
          </div>
        </div>
      </div>

      <div style="margin-top: 18px;">
        <label class="lbl">Asistentes Agregados: <span id="form-asistentes-count" style="font-weight: bold;">0</span></label>
      </div>
    </div>

    <div class="btn-group" style="justify-content: space-between;">
      <button type="button" class="btn btn-secondary" id="btn-cancelar-form">Volver al Listado</button>
      <button type="submit" class="btn btn-success" id="btn-guardar-form">Guardar Formato</button>
    </div>
  </form>
</div>

<!-- Configuración Inicial -->
<script>
  window.CONFIG = __CONFIG__;
</script>

<script>
  // State variables
  let formAsistentes = []; // Lista de objetos { id_vinculacion, Trabajador, Identificación, Cargo, Operación, Regional }
  let selectedAsistenciaId = null;

  // DOM Elements
  const loading = document.getElementById('loading');
  const loadingText = document.getElementById('loading-text');

  // Initialization
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('user-badge').innerText = `Usuario: ${CONFIG.usuarioNombre} (${CONFIG.rol})`;
    
    // Configurar selectores de Regional y Operación en Formulario
    poblarFormDropdowns();

    // Event Listeners
    document.getElementById('btn-cancelar-form').addEventListener('click', () => volverAlListado());
    document.getElementById('form-asistencia').addEventListener('submit', guardarAsistencia);

    // Autocomplete Responsable (BÚSQUEDA EXCLUSIVAMENTE POR IDENTIFICACIÓN)
    setupAutocomplete(
      document.getElementById('form-responsable-input'),
      document.getElementById('ac-responsable'),
      '/participacion/api/responsables-buscar',
      (item) => {
        document.getElementById('form-responsable-input').value = `${item.Identificación} ** ${item.Trabajador}`;
        document.getElementById('form-responsable-id').value = item.id_vinculacion;
      }
    );

    // Búsqueda en el checklist de asistentes
    document.getElementById('checklist-search-input').addEventListener('input', (e) => {
      const val = e.target.value.toLowerCase();
      const items = document.querySelectorAll('.checklist-item');
      items.forEach(item => {
        const text = item.innerText.toLowerCase();
        if (text.includes(val)) {
          item.style.display = 'flex';
        } else {
          item.style.display = 'none';
        }
      });
    });

    // Seleccionar Todos en checklist
    document.getElementById('chk-seleccionar-todos').addEventListener('change', (e) => {
      const checked = e.target.checked;
      const visibleCheckboxes = document.querySelectorAll('.checklist-item input[type="checkbox"]');
      visibleCheckboxes.forEach(cb => {
        const itemDom = cb.closest('.checklist-item');
        if (itemDom.style.display !== 'none') {
          cb.checked = checked;
          cb.dispatchEvent(new Event('change'));
        }
      });
    });

    // Detectar si estamos editando
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    if (id) {
      document.getElementById('form-titulo').innerText = 'Editar Formato de Participación';
      selectedAsistenciaId = id;
      cargarAsistenciaParaEditar(id);
    } else {
      document.getElementById('form-titulo').innerText = 'Crear Formato de Participación';
      document.getElementById('form-fecha').value = new Date().toISOString().slice(0, 10);
      
      // Pre-llenar el responsable automáticamente
      if (CONFIG.prefillResponsable) {
        document.getElementById('form-responsable-input').value = CONFIG.prefillResponsable.nombre;
        document.getElementById('form-responsable-id').value = CONFIG.prefillResponsable.id_vinculacion;
      }
      document.getElementById('form-asistentes-count').innerText = '0';
    }
  });

  // Helper Toast
  function showToast(msg, type = 'success') {
    const container = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.innerText = msg;
    container.appendChild(t);
    setTimeout(() => t.remove(), 4000);
  }

  function showLoading(text = 'Cargando...') {
    loadingText.innerText = text;
    loading.classList.add('active');
  }

  function hideLoading() {
    loading.classList.remove('active');
  }

  function volverAlListado() {
    window.location.href = `/participacion?usuario=${CONFIG.usuarioId}`;
  }

  function poblarFormDropdowns() {
    const rForm = document.getElementById('form-asistente-regional');
    const oForm = document.getElementById('form-asistente-operacion');

    // Poblamos Regionales en Formulario
    CONFIG.regionalesFiltro.forEach(reg => {
      const optForm = document.createElement('option');
      optForm.value = reg; optForm.innerText = reg;
      rForm.appendChild(optForm);
    });

    // Cambio de regional en Formulario
    rForm.addEventListener('change', () => {
      oForm.innerHTML = '<option value="">Seleccione Operación...</option>';
      document.getElementById('form-asistentes-checklist-wrap').style.display = 'none';
      const reg = rForm.value;
      const ops = reg ? (CONFIG.opsPorRegional[reg] || []) : [];
      ops.forEach(op => {
        const opt = document.createElement('option');
        opt.value = op; opt.innerText = op;
        oForm.appendChild(opt);
      });
    });

    oForm.addEventListener('change', cargarTrabajadoresParaChecklist);
  }

  // ════════ LÓGICA DE CHECKLIST (ASISTENTES) ════════
  async function cargarTrabajadoresParaChecklist() {
    const regional = document.getElementById('form-asistente-regional').value;
    const operacion = document.getElementById('form-asistente-operacion').value;
    const wrap = document.getElementById('form-asistentes-checklist-wrap');
    const body = document.getElementById('form-checklist-body');
    const chkTodos = document.getElementById('chk-seleccionar-todos');

    if (!regional || !operacion) {
      wrap.style.display = 'none';
      return;
    }

    showLoading('Cargando colaboradores de la operación...');
    try {
      chkTodos.checked = false;
      const res = await fetch(`/participacion/api/trabajadores-por-operacion?regional=${encodeURIComponent(regional)}&operacion=${encodeURIComponent(operacion)}`);
      const trabajadores = await res.json();

      body.innerHTML = '';
      if (!trabajadores.length) {
        body.innerHTML = '<div style="padding: 15px; text-align: center; color: #888;">No hay colaboradores activos en esta operación.</div>';
        wrap.style.display = 'block';
        return;
      }

      trabajadores.forEach(t => {
        const isChecked = formAsistentes.some(x => x.id_vinculacion === t.id_vinculacion);

        const div = document.createElement('div');
        div.className = 'checklist-item';
        
        const idCheckbox = `chk-t-${t.id_vinculacion}`;
        
        div.innerHTML = `
          <input type="checkbox" id="${idCheckbox}" ${isChecked ? 'checked' : ''}>
          <label for="${idCheckbox}"><strong>${t.identificacion}</strong> ** ${t.Trabajador}</label>
        `;

        const checkbox = div.querySelector('input[type="checkbox"]');
        checkbox.addEventListener('change', (e) => {
          if (e.target.checked) {
            if (!formAsistentes.some(x => x.id_vinculacion === t.id_vinculacion)) {
              formAsistentes.push({
                id_vinculacion: t.id_vinculacion,
                Trabajador: t.Trabajador,
                Identificación: t.identificacion,
                Cargo: t.Cargo,
                Operación: t.Operación,
                Regional: t.Regional
              });
            }
          } else {
            formAsistentes = formAsistentes.filter(x => x.id_vinculacion !== t.id_vinculacion);
          }
          document.getElementById('form-asistentes-count').innerText = formAsistentes.length;
        });

        div.addEventListener('click', (e) => {
          if (e.target !== checkbox && e.target.tagName !== 'LABEL') {
            checkbox.checked = !checkbox.checked;
            checkbox.dispatchEvent(new Event('change'));
          }
        });

        body.appendChild(div);
      });

      wrap.style.display = 'block';
    } catch (err) {
      console.error(err);
      showToast('Error al cargar colaboradores.', 'error');
    } finally {
      hideLoading();
    }
  }

  // ════════ LÓGICA DE AUTOCOMPLETE ════════
  function setupAutocomplete(input, listDiv, url, onSelect) {
    input.addEventListener('input', debounce(async () => {
      const val = input.value.trim();
      if (!val || val.length < 2) {
        listDiv.innerHTML = '';
        listDiv.classList.remove('open');
        return;
      }

      try {
        const res = await fetch(`${url}?q=${encodeURIComponent(val)}`);
        const items = await res.json();

        listDiv.innerHTML = '';
        if (!items.length) {
          listDiv.classList.remove('open');
          return;
        }

        items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'ac-item';
          div.innerText = `${item.Identificación} ** ${item.Trabajador}`;

          div.addEventListener('click', () => {
            onSelect(item);
            listDiv.innerHTML = '';
            listDiv.classList.remove('open');
          });
          listDiv.appendChild(div);
        });
        listDiv.classList.add('open');
      } catch (err) {
        console.error(err);
      }
    }, 300));

    document.addEventListener('click', (e) => {
      if (e.target !== input && e.target !== listDiv) {
        listDiv.innerHTML = '';
        listDiv.classList.remove('open');
      }
    });
  }

  function debounce(func, wait) {
    let timeout;
    return function(...args) {
      clearTimeout(timeout);
      timeout = setTimeout(() => func.apply(this, args), wait);
    };
  }

  // ════════ CARGAR PARA EDITAR ════════
  async function cargarAsistenciaParaEditar(id) {
    showLoading('Cargando datos del formato...');
    try {
      const res = await fetch(`/participacion/api/asistencia/${id}`);
      const data = await res.json();

      document.getElementById('form-tema').value = data.tema;
      document.getElementById('form-fecha').value = data.fecha.slice(0, 10);
      document.getElementById('form-hora-inicial').value = data.hora_inicial.slice(0, 5);
      document.getElementById('form-hora-final').value = data.hora_final.slice(0, 5);
      document.getElementById('form-lugar').value = data.lugar;
      document.getElementById('form-objetivo').value = data.objetivo;
      document.getElementById('form-responsable-input').value = data.nombre_responsable || '';
      document.getElementById('form-responsable-id').value = data.responsable;

      formAsistentes = data.items.map(i => ({
        id_vinculacion: i.id_vinculacion,
        Trabajador: i.nombre_trabajador,
        Identificación: i.identificacion,
        Cargo: i.cargo,
        Operación: i.operacion,
        Regional: i.regional
      }));
      document.getElementById('form-asistentes-count').innerText = formAsistentes.length;
    } catch (err) {
      console.error(err);
      showToast('Error al cargar datos del formato', 'error');
    } finally {
      hideLoading();
    }
  }

  // ════════ GUARDAR FORMULARIO ════════
  async function guardarAsistencia(e) {
    e.preventDefault();

    const responsable = document.getElementById('form-responsable-id').value;
    if (!responsable) {
      showToast('Por favor selecciona un responsable válido utilizando su identificación.', 'error');
      return;
    }

    if (!formAsistentes.length) {
      showToast('Por favor selecciona al menos un asistente.', 'error');
      return;
    }

    const payload = {
      tema: document.getElementById('form-tema').value,
      fecha: document.getElementById('form-fecha').value,
      hora_inicial: document.getElementById('form-hora-inicial').value,
      hora_final: document.getElementById('form-hora-final').value,
      lugar: document.getElementById('form-lugar').value,
      objetivo: document.getElementById('form-objetivo').value,
      responsable,
      usuario: CONFIG.usuarioId,
      asistentes: formAsistentes.map(x => x.id_vinculacion)
    };

    showLoading('Guardando registro...');
    try {
      const url = selectedAsistenciaId 
        ? `/participacion/api/asistencia/${selectedAsistenciaId}` 
        : '/participacion/api/asistencias';
      const method = selectedAsistenciaId ? 'PUT' : 'POST';

      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const resData = await res.json();

      if (resData.ok) {
        showToast('Formato de asistencia guardado exitosamente.');
        setTimeout(() => volverAlListado(), 1000);
      } else {
        showToast(resData.error || 'Error al guardar.', 'error');
      }
    } catch (err) {
      console.error(err);
      showToast('Error de red al guardar el formato.', 'error');
    } finally {
      hideLoading();
    }
  }
</script>

</body>
