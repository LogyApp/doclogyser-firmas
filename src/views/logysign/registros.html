<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logysign — Historial de Registros</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #000b59;
      --primary-dark: #00073a;
      --primary-light: #1c2a7a;
      --accent: #F55400;
      --accent-dark: #d64700;
      --accent-soft: rgba(245, 84, 0, 0.1);
      --success: #16a34a;
      --success-soft: rgba(22, 163, 74, 0.08);
      --danger: #dc2626;
      --bg: #f4f5f9;
      --card-bg: #ffffff;
      --text: #101425;
      --text-muted: #6b7280;
      --border: #e7e8ef;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.04);
      --shadow-md: 0 8px 20px -6px rgba(16, 24, 40, 0.10), 0 2px 6px -2px rgba(16, 24, 40, 0.06);
      --shadow-lg: 0 20px 40px -12px rgba(0, 11, 89, 0.22);
      --transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header styling */
    header {
      background: var(--primary);
      border-radius: var(--radius-lg);
      padding: 10px 24px;
      color: #fff;
      margin-bottom: 22px;
      box-shadow: var(--shadow-lg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }

    header::after {
      content: '';
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 3px;
      background: var(--accent);
    }

    .brand-lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      flex-shrink: 0;
    }

    .brand-lockup img.brand-logo-app {
      display: block;
      object-fit: contain;
      height: 30px;
    }

    .brand-logo-company-crop {
      width: 133px;
      height: 34px;
      overflow: hidden;
      position: relative;
    }

    .brand-logo-company-crop img {
      position: absolute;
      left: -64px;
      top: -65px;
      width: 268px;
      height: 178px;
      max-width: none;
    }

    .brand-divider {
      width: 80%;
      height: 1.5px;
      background: rgba(255, 255, 255, 0.22);
    }

    .header-logo {
      text-align: center;
    }

    .header-logo h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #fff;
    }

    .header-logo h1 .accent {
      color: var(--accent);
    }

    .header-logo p {
      font-size: 0.98rem;
      color: rgba(255, 255, 255, 0.68);
      margin-top: 3px;
    }

    .user-badge {
      background: rgba(255, 255, 255, 0.08);
      padding: 9px 18px 9px 14px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.16);
      display: inline-flex;
      align-items: center;
      gap: 9px;
      flex-shrink: 0;
    }

    .user-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .btn-action-nav {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      padding: 9px 18px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.16);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: var(--transition);
    }

    .btn-action-nav:hover {
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-chip {
      background: rgba(0, 11, 89, 0.05);
      color: var(--primary);
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Filters Layout */
    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input, .form-group select {
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 0.9rem;
      background: #fafbfe;
      color: var(--text);
      transition: var(--transition);
      width: 100%;
    }

    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(0, 11, 89, 0.08);
    }

    /* Table & Responsiveness */
    .table-container {
      width: 100%;
      overflow-x: auto;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: left;
    }

    th {
      background: #fafbfe;
      padding: 14px 16px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
      font-size: 0.78rem;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      color: var(--text);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: #fafbfe;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-pending {
      background: rgba(0, 11, 89, 0.08);
      color: var(--primary);
      border: 1px solid rgba(0, 11, 89, 0.16);
    }

    .badge-signed {
      background: var(--success-soft);
      color: var(--success);
      border: 1px solid rgba(22, 163, 74, 0.16);
    }

    /* Buttons */
    .btn {
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      text-decoration: none;
      justify-content: center;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--primary-light);
    }

    .btn-accent {
      background: var(--accent);
      color: #fff;
    }
    .btn-accent:hover {
      background: var(--accent-dark);
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }
    .btn-success:hover {
      background: #15803d;
    }

    .btn-secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--border);
    }
    .btn-secondary:hover {
      background: #fafbfe;
      border-color: var(--text-muted);
    }

    /* Toast styling */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 14px 24px;
      border-radius: var(--radius-md);
      background: #101425;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      z-index: 1000;
      display: none;
      animation: fadeInUp 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .toast-success {
      border-left: 4px solid var(--success);
    }

    .toast-error {
      border-left: 4px solid var(--danger);
    }

    @keyframes fadeInUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Loading Overlay */
    .loading-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(16, 20, 37, 0.55);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1100;
      flex-direction: column;
      gap: 16px;
    }

    .loading-overlay h3 {
      color: #fff !important;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid rgba(255,255,255,0.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Helper styles */
    .no-records {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
    <h3 id="loading-text">Cargando registros...</h3>
  </div>

  <div class="toast" id="toast">Toast Message</div>

  <div class="container">
    <header>
      <div class="brand-lockup">
        <img class="brand-logo-app" src="https://storage.googleapis.com/logyser-recursos-corporativos/Imagenes/Logo%20LogyApp.png" alt="LogyApp">
        <div class="brand-divider"></div>
        <div class="brand-logo-company-crop">
          <img src="https://storage.googleapis.com/logyser-recursos-corporativos/Imagenes/Logyser%20sin%20Nit.png" alt="Logyser">
        </div>
      </div>
      <div class="header-logo">
        <h1>Logy<span class="accent">Sign</span></h1>
        <p>Historial de Registros y Control de Firmas</p>
      </div>
      <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <a class="btn-action-nav" id="btn-volver-preparar" href="#">
          <svg style="width:16px;height:16px" viewBox="0 0 24 24"><path fill="currentColor" d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z"/></svg>
          Nueva Firma
        </a>
        <div class="user-badge" id="user-badge-name">
          Cargando usuario...
        </div>
      </div>
    </header>

    <!-- Sección de Filtros -->
    <div class="card">
      <h2 class="card-title">
        <span class="icon-chip">
          <svg style="width:18px;height:18px" viewBox="0 0 24 24"><path fill="currentColor" d="M14,12V19.88C14.04,20.18 13.94,20.5 13.71,20.71C13.32,21.1 12.69,21.1 12.3,20.71L10.29,18.7C10.06,18.47 9.96,18.16 10,17.87V12H9.97L4.21,4.62C3.82,4.11 4.18,3.38 4.82,3.38H19.17C19.81,3.38 20.17,4.11 19.78,4.62L14.03,12H14Z"/></svg>
        </span>
        Filtros de Búsqueda
      </h2>
      <div class="filters-grid">
        <div class="form-group">
          <label for="filter-search">Colaborador / Documento</label>
          <input type="text" id="filter-search" placeholder="Busque por nombre, cédula o documento...">
        </div>
        <div class="form-group">
          <label for="filter-status">Estado</label>
          <select id="filter-status">
            <option value="">-- Todos --</option>
            <option value="PENDIENTE">Pendientes de Firma</option>
            <option value="FIRMADO">Firmados</option>
          </select>
        </div>
        <div class="form-group">
          <label for="filter-desde">Desde</label>
          <input type="date" id="filter-desde">
        </div>
        <div class="form-group">
          <label for="filter-hasta">Hasta</label>
          <input type="date" id="filter-hasta">
        </div>
      </div>
    </div>

    <!-- Resultados -->
    <div class="card">
      <h2 class="card-title" style="justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span class="icon-chip">
            <svg style="width:18px;height:18px" viewBox="0 0 24 24"><path fill="currentColor" d="M14,10H19.5L14,4.5V10M5,3H15L21,9V19A2,2 0 0,1 19,21H5C3.89,21 3,20.1 3,19V5C3,3.89 3.89,3 5,3M5,5V19H19V12H12V5H5Z"/></svg>
          </span>
          Lista de Envios
        </div>
        <span id="records-counter" style="font-size: 0.85rem; font-weight: 500; color: var(--text-muted);">Total: 0</span>
      </h2>

      <div class="table-container">
        <table id="records-table">
          <thead>
            <tr>
              <th>Colaborador</th>
              <th>Documento</th>
              <th>Fecha de Registro</th>
              <th id="th-creador" style="display: none;">Creado por</th>
              <th>Estado</th>
              <th style="width: 260px; text-align: center;">Acciones</th>
            </tr>
          </thead>
          <tbody id="records-body">
            <tr>
              <td colspan="6" style="text-align: center; padding: 40px; color: var(--text-muted);">Cargando registros...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Load config from backend
    const CONFIG = __CONFIG__;

    // Globals
    let records = [];

    // Elements
    const userBadge = document.getElementById('user-badge-name');
    const btnVolver = document.getElementById('btn-volver-preparar');
    const filterSearch = document.getElementById('filter-search');
    const filterStatus = document.getElementById('filter-status');
    const filterDesde = document.getElementById('filter-desde');
    const filterHasta = document.getElementById('filter-hasta');
    const recordsBody = document.getElementById('records-body');
    const recordsCounter = document.getElementById('records-counter');
    const thCreador = document.getElementById('th-creador');
    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');

    // Init page info
    userBadge.innerText = CONFIG.usuarioNombre;
    btnVolver.href = `/logysign?usuario=${CONFIG.usuarioId}`;

    if (CONFIG.usuarioRol === 'Sistema') {
      thCreador.style.display = 'table-cell';
    }

    // Show toast message
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.className = `toast toast-${type}`;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
      }, 4000);
    }

    function showLoading(text = 'Cargando...') {
      loadingText.innerText = text;
      loadingOverlay.style.display = 'flex';
    }

    function hideLoading() {
      loadingOverlay.style.display = 'none';
    }

    // Load records from backend API
    async function loadRecords() {
      showLoading('Cargando registros...');
      try {
        const res = await fetch(`/registrologysign/api/registros?usuario=${CONFIG.usuarioId}`);
        if (!res.ok) throw new Error('No se pudieron cargar los registros');
        records = await res.json();
        renderRecords();
      } catch (err) {
        showToast(err.message, 'error');
        recordsBody.innerHTML = `<tr><td colspan="${CONFIG.usuarioRol === 'Sistema' ? 6 : 5}" class="no-records">Error: ${err.message}</td></tr>`;
      } finally {
        hideLoading();
      }
    }

    // Filter and Render records
    function renderRecords() {
      const q = filterSearch.value.trim().toLowerCase();
      const status = filterStatus.value;
      const desde = filterDesde.value;
      const hasta = filterHasta.value;

      const filtered = records.filter(item => {
        // Search term filter
        if (q) {
          const textMatch = 
            (item.nombre_trabajador || '').toLowerCase().includes(q) ||
            (item.identificacion || '').toLowerCase().includes(q) ||
            (item.nombre_documento || item.prefijo || '').toLowerCase().includes(q);
          if (!textMatch) return false;
        }

        // Status filter
        if (status && item.estado !== status) return false;

        // Date range filter
        if (item.fecha_registro) {
          const itemDate = item.fecha_registro.split('T')[0];
          if (desde && itemDate < desde) return false;
          if (hasta && itemDate > hasta) return false;
        }

        return true;
      });

      // Update counter
      recordsCounter.innerText = `Total: ${filtered.length}`;

      recordsBody.innerHTML = '';
      if (filtered.length === 0) {
        recordsBody.innerHTML = `<tr><td colspan="${CONFIG.usuarioRol === 'Sistema' ? 6 : 5}" class="no-records">No se encontraron registros.</td></tr>`;
        return;
      }

      filtered.forEach(item => {
        const tr = document.createElement('tr');
        
        // Date Formatting
        let dateStr = '—';
        if (item.fecha_registro) {
          const dateObj = new Date(item.fecha_registro);
          dateStr = dateObj.toLocaleDateString('es-CO', { timeZone: 'America/Bogota' }) + ' ' + 
                    dateObj.toLocaleTimeString('es-CO', { timeZone: 'America/Bogota', hour: '2-digit', minute: '2-digit' });
        }

        // Status badge
        const badgeClass = item.estado === 'FIRMADO' ? 'badge-signed' : 'badge-pending';
        const badgeLabel = item.estado === 'FIRMADO' ? '✓ Firmado' : 'Pendiente';
        const badgeHtml = `<span class="badge ${badgeClass}">${badgeLabel}</span>`;

        // Action Buttons
        let actionsHtml = '';
        if (item.estado === 'PENDIENTE') {
          const linkFirma = `${window.location.origin}/logysign/sign/${item.token}`;
          actionsHtml = `
            <div style="display: flex; gap: 6px; justify-content: center;">
              <button class="btn btn-secondary" onclick="copiarAlPortapapeles('${linkFirma}')">
                <svg style="width:14px;height:14px" viewBox="0 0 24 24"><path fill="currentColor" d="M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z"/></svg>
                Copiar Enlace
              </button>
              <button class="btn btn-primary" onclick="reenviarCorreo('${item.id}')">
                <svg style="width:14px;height:14px" viewBox="0 0 24 24"><path fill="currentColor" d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/></svg>
                Reenviar
              </button>
            </div>
          `;
        } else {
          const viewPdfUrl = `/logysign/api/signed-pdf/${item.id}`;
          actionsHtml = `
            <div style="display: flex; gap: 6px; justify-content: center;">
              <a href="${viewPdfUrl}" target="_blank" class="btn btn-success" style="width: 100%;">
                <svg style="width:14px;height:14px" viewBox="0 0 24 24"><path fill="currentColor" d="M19,3H14.82C14.4,1.84 13.3,1 12,1C10.7,1 9.6,1.84 9.18,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M12,3A1,1 0 0,1 13,4A1,1 0 0,1 12,5A1,1 0 0,1 11,4A1,1 0 0,1 12,3M14,17H7V15H14V17M17,13H7V11H17V13M17,9H7V7H17V9Z"/></svg>
                Ver PDF Firmado
              </a>
            </div>
          `;
        }

        // Conditionally render creador column
        let creadorTdHtml = '';
        if (CONFIG.usuarioRol === 'Sistema') {
          creadorTdHtml = `<td>${item.nombre_creador || item.usuario_creador || '—'}</td>`;
        }

        tr.innerHTML = `
          <td>
            <strong>${item.nombre_trabajador}</strong><br>
            <span style="font-size: 0.8rem; color: var(--text-muted);">C.C. ${item.identificacion}</span>
          </td>
          <td>
            <strong>${item.nombre_documento || item.prefijo || 'Documento'}</strong><br>
            <span style="font-size: 0.8rem; color: var(--text-muted);">Cargo: ${item.cargo || '—'}</span>
          </td>
          <td>${dateStr}</td>
          ${creadorTdHtml}
          <td>${badgeHtml}</td>
          <td>${actionsHtml}</td>
        `;
        recordsBody.appendChild(tr);
      });
    }

    // Copy to clipboard helper
    function copiarAlPortapapeles(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('Enlace de firma copiado al portapapeles', 'success');
      }).catch(err => {
        showToast('No se pudo copiar el enlace', 'error');
      });
    }

    // Re-send invitation API trigger
    async function reenviarCorreo(id) {
      showLoading('Reenviando recordatorio de firma...');
      try {
        const res = await fetch('/registrologysign/api/reenviar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'No se pudo reenviar la notificación');
        showToast('Notificación recordatorio reenviada con éxito', 'success');
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        hideLoading();
      }
    }

    // Filter listeners
    filterSearch.addEventListener('input', renderRecords);
    filterStatus.addEventListener('change', renderRecords);
    filterDesde.addEventListener('change', renderRecords);
    filterHasta.addEventListener('change', renderRecords);

    // Initial Load
    loadRecords();
  </script>
</body>
