<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor — __PROCESO__</title>
  <link rel="icon" type="image/png" href="https://storage.googleapis.com/logyser-recursos-corporativos/menu-solicitudes/Logodocnomina.png">
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    h1 { font-size: 1.3rem; color: #333; margin-bottom: 20px; }
    .variables { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 4px; padding: 12px; margin-bottom: 20px; }
    .variables strong { display: block; font-size: .85rem; color: #495057; margin-bottom: 8px; }
    .variables code { background: #e9ecef; padding: 2px 7px; border-radius: 3px; font-family: monospace; font-size: .8rem; display: inline-block; margin: 2px; cursor: pointer; }
    .variables code:hover { background: #d0d7e0; }
    #editor { height: 600px; font-size: 14px; }
    .ql-toolbar { border-radius: 4px 4px 0 0; }
    .ql-container { border-radius: 0 0 4px 4px; font-family: Arial, sans-serif; }
    .btn-save { margin-top: 16px; background: #e67e22; color: #fff; border: none; padding: 11px 28px; border-radius: 5px; cursor: pointer; font-size: 1rem; font-weight: bold; }
    .btn-save:hover { background: #d35400; }
    .btn-save:disabled { background: #aaa; cursor: not-allowed; }
    .status { margin-top: 10px; font-size: .9rem; min-height: 20px; }
    .ok { color: #27ae60; }
    .error { color: #e74c3c; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Editor de plantilla: __PROCESO__</h1>

    <div class="variables">
      <strong>Variables disponibles (clic para insertar):</strong>
      <code>{{fecha_aviso}}</code>
      <code>{{Trabajador}}</code>
      <code>{{Identificación}}</code>
      <code>{{operacion_origen}}</code>
      <code>{{operacion_destino}}</code>
      <code>{{direccion_destino}}</code>
      <code>{{fecha_traslado}}</code>
      <code>{{hora_traslado}}</code>
      <code>{{firma_trabajador}}</code>
      <code>{{firma_representante}}</code>
      <code>{{logo}}</code>
    </div>

    <div id="editor"></div>

    <button class="btn-save" id="btnGuardar">Guardar cambios</button>
    <div class="status" id="status"></div>
  </div>

  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <script>
    const _contenido = __CONTENIDO_HTML__;

    const quill = new Quill('#editor', {
      theme: 'snow',
      modules: {
        toolbar: [
          [{ header: [1, 2, 3, false] }],
          ['bold', 'italic', 'underline'],
          [{ align: [] }],
          [{ list: 'ordered' }, { list: 'bullet' }],
          [{ color: [] }, { background: [] }],
          ['link'],
          ['clean']
        ]
      }
    });

    if (_contenido) {
      quill.clipboard.dangerouslyPasteHTML(0, _contenido);
    }

    document.querySelectorAll('.variables code').forEach(tag => {
      tag.addEventListener('click', () => {
        const range = quill.getSelection(true);
        quill.insertText(range.index, tag.textContent);
        quill.setSelection(range.index + tag.textContent.length);
      });
    });

    document.getElementById('btnGuardar').addEventListener('click', async () => {
      const btn = document.getElementById('btnGuardar');
      const statusEl = document.getElementById('status');
      btn.disabled = true;
      statusEl.textContent = 'Guardando…';
      statusEl.className = 'status';
      try {
        const resp = await fetch(window.location.pathname, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contenido_html: quill.root.innerHTML })
        });
        const data = await resp.json();
        statusEl.textContent = data.ok ? 'Guardado correctamente.' : 'Error al guardar.';
        statusEl.className = 'status ' + (data.ok ? 'ok' : 'error');
      } catch {
        statusEl.textContent = 'Error de conexión.';
        statusEl.className = 'status error';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
