<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Documento para firma</title>
  <link rel="icon" type="image/png" href="https://storage.googleapis.com/logyser-recursos-corporativos/menu-solicitudes/Logodocnomina.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f0f0; }
    .wrapper { max-width: 820px; margin: 0 auto; padding: 20px 16px; }

    .doc-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .doc-toggle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px; cursor: pointer;
      background: #f8f9fb; border-bottom: 1px solid #eee;
      user-select: none;
    }
    .doc-toggle-label { font-size: .8rem; font-weight: 700; color: #1a1a2e; letter-spacing: .8px; }
    .doc-toggle-btn {
      font-size: .78rem; color: #1a5fa8; font-weight: 600;
      background: #eaf3ff; border: none; border-radius: 4px;
      padding: 3px 10px; cursor: pointer;
    }
    .documento {
      padding: 28px 32px;
      line-height: 1.6;
    }
    .documento p { text-align: justify; margin-bottom: 8px; }
    .documento img { max-width: 100%; }
    .firma-seccion {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    .firma-label {
      font-weight: bold;
      font-size: .85rem;
      letter-spacing: 1px;
      color: #333;
      text-align: center;
      margin-bottom: 14px;
    }
    #canvasFirma {
      display: block;
      margin: 0 auto;
      border: 2px solid #ccc;
      border-radius: 4px;
      background: #fff;
      cursor: crosshair;
      touch-action: none;
      width: 100%;
      max-width: 400px;
      height: 200px;
    }
    .firma-botones {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 16px;
    }
    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-limpiar { background: #ecf0f1; color: #333; border: 1px solid #bdc3c7; }
    .btn-limpiar:hover { background: #bdc3c7; }
    .btn-guardar { background: #e67e22; color: #fff; }
    .btn-guardar:hover { background: #d35400; }
    .btn-guardar:disabled, .btn-limpiar:disabled { background: #ccc; cursor: not-allowed; color: #888; }
    .mensaje { text-align: center; margin-top: 14px; font-size: .9rem; min-height: 20px; }
    .mensaje.ok { color: #27ae60; font-weight: bold; }
    .mensaje.error { color: #e74c3c; }
    @media (max-width: 480px) {
      .documento { padding: 14px; }
      .firma-seccion { padding: 16px; }
      .btn { padding: 11px 20px; font-size: .95rem; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="doc-card">
      <div class="doc-toggle" onclick="toggleDoc()">
        <span class="doc-toggle-label">📄 DOCUMENTO DE TRASLADO</span>
        <button class="doc-toggle-btn" id="btnToggle">▲ Ocultar</button>
      </div>
      <div id="docBody">
        <div class="documento" id="contenidoDoc"></div>
      </div>
    </div>

    <div class="firma-seccion">
      <div class="firma-label">FIRMA DEL TRABAJADOR</div>
      <canvas id="canvasFirma" width="400" height="200"></canvas>
      <div class="firma-botones">
        <button class="btn btn-limpiar" id="btnLimpiar">Limpiar</button>
        <button class="btn btn-guardar" id="btnGuardar">Guardar</button>
      </div>
      <div class="mensaje" id="mensaje"></div>
    </div>
  </div>

  <script>
    const _cfg = __CONFIG__;
    const TOKEN = _cfg.token;
    const PROCESO = _cfg.proceso;
    const ID = _cfg.id;
    const FIRMA_PREVIA = _cfg.firmaPrevia;
    const DOCUMENTO_HTML = _cfg.documentoHtml;

    document.getElementById('contenidoDoc').innerHTML = DOCUMENTO_HTML;

    let docVisible = true;
    function toggleDoc() {
      docVisible = !docVisible;
      document.getElementById('docBody').style.display  = docVisible ? '' : 'none';
      document.getElementById('btnToggle').textContent  = docVisible ? '▲ Ocultar' : '▼ Ver documento';
      if (!docVisible) document.querySelector('.firma-seccion').scrollIntoView({ behavior: 'smooth' });
    }

    const canvas = document.getElementById('canvasFirma');
    const ctx = canvas.getContext('2d');
    let dibujando = false;
    let esNuevaFirma = false;

    function limpiar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    limpiar();

    if (FIRMA_PREVIA) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      img.src = FIRMA_PREVIA;
    }

    function coordenadas(e) {
      const r = canvas.getBoundingClientRect();
      const sx = canvas.width / r.width;
      const sy = canvas.height / r.height;
      const src = e.touches ? e.touches[0] : e;
      return { x: (src.clientX - r.left) * sx, y: (src.clientY - r.top) * sy };
    }

    function iniciar(e) {
      e.preventDefault();
      dibujando = true;
      esNuevaFirma = true;
      const p = coordenadas(e);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
    }

    function trazar(e) {
      if (!dibujando) return;
      e.preventDefault();
      const p = coordenadas(e);
      ctx.lineTo(p.x, p.y);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    function terminar() { dibujando = false; }

    canvas.addEventListener('mousedown', iniciar);
    canvas.addEventListener('mousemove', trazar);
    canvas.addEventListener('mouseup', terminar);
    canvas.addEventListener('mouseleave', terminar);
    canvas.addEventListener('touchstart', iniciar, { passive: false });
    canvas.addEventListener('touchmove', trazar, { passive: false });
    canvas.addEventListener('touchend', terminar);

    document.getElementById('btnLimpiar').addEventListener('click', () => {
      limpiar();
      esNuevaFirma = true;
    });

    document.getElementById('btnGuardar').addEventListener('click', async () => {
      const btn = document.getElementById('btnGuardar');
      const limpiarBtn = document.getElementById('btnLimpiar');
      const msgEl = document.getElementById('mensaje');

      btn.disabled = true;
      msgEl.textContent = 'Guardando…';
      msgEl.className = 'mensaje';

      try {
        const firma_base64 = canvas.toDataURL('image/png');
        const resp = await fetch(`/doclogyser/${PROCESO}/${ID}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: TOKEN, firma_base64, es_nueva_firma: esNuevaFirma })
        });
        const data = await resp.json();
        if (data.ok) {
          msgEl.textContent = 'Documento firmado y generado correctamente.';
          msgEl.className = 'mensaje ok';
          limpiarBtn.disabled = true;
        } else {
          msgEl.textContent = data.error || 'Error al guardar.';
          msgEl.className = 'mensaje error';
          btn.disabled = false;
        }
      } catch {
        msgEl.textContent = 'Error de conexión. Intente nuevamente.';
        msgEl.className = 'mensaje error';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
